name: Deploy Update to Hosting (FTP)

on:
  push:
    branches:
      - main
    paths:
      - 'aetherbuilder-update.zip'
      - 'version.json'

jobs:
  deploy-update:
    name: Upload aetherbuilder-update.zip via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo so we have the updated files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Upload ONLY aetherbuilder-update.zip and version.json to hosting
      #    SamKirkland/FTP-Deploy-Action v4.3.5 does NOT support 'include'.
      #    Use 'exclude' with glob negation OR upload files manually via curl/ftp.
      #    We use the exclude approach: deploy only root-level files, skip everything else.
      - name: Upload update ZIP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Exclude everything EXCEPT the two target files
          exclude: |
            **
            !aetherbuilder-update.zip
            !version.json
          log-level: standard
          timeout: 60000

      # 3. Print confirmation
      - name: Deployment complete
        run: |
          echo "✅ aetherbuilder-update.zip and version.json uploaded to hosting!"
          echo "All AetherBuilder admin panels will now see the update notification."
