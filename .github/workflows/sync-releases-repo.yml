name: Sync Release to Public Distribution Repo

on:
  push:
    branches:
      - main
    paths:
      - 'aetherbuilder-update.zip'
      - 'version.json'
  workflow_dispatch:

jobs:
  sync-releases:
    name: Push Core Update to aetherbuilder-releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Deploy to Public Releases Channel
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "⚠️ RELEASE_TOKEN secret is not set yet in Repository Secrets."
            echo "To enable automated sync to bernardlolo25/aetherbuilder-releases:"
            echo "1. Go to Settings > Secrets and variables > Actions"
            echo "2. Add secret RELEASE_TOKEN with your GitHub PAT."
            exit 0
          fi

          # Read version dynamically from version.json
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "📦 Syncing AetherBuilder v${VERSION} to public releases channel..."

          git config --global user.name "Bernard Lolo"
          git config --global user.email "mr.softexpert@gmail.com"

          TARGET_DIR="/tmp/releases_sync"
          rm -rf "$TARGET_DIR"
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/bernardlolo25/aetherbuilder-releases.git" "$TARGET_DIR"

          # Always copy the generic and versioned zip
          cp version.json "$TARGET_DIR/version.json"
          cp aetherbuilder-update.zip "$TARGET_DIR/aetherbuilder-update.zip"

          # Copy versioned zip if it exists
          VERSIONED_ZIP="aetherbuilder-update-v${VERSION}.zip"
          if [ -f "$VERSIONED_ZIP" ]; then
            cp "$VERSIONED_ZIP" "$TARGET_DIR/$VERSIONED_ZIP"
            echo "✅ Copied $VERSIONED_ZIP"
          else
            echo "ℹ️  No versioned zip found for v${VERSION}, skipping."
          fi

          cd "$TARGET_DIR"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "✅ Public releases channel is already up to date."
          else
            git commit -m "release: AetherBuilder v${VERSION} — synced $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "🎉 Successfully pushed AetherBuilder v${VERSION} to aetherbuilder-releases!"
          fi
